[project]
name = "scout"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cssselect>=1.4.0",
    "domdistill",
    "faiss-cpu>=1.13.2",
    "html-to-markdown>=3.1.0",
    "lxml>=6.0.3",
    "playwright>=1.58.0",
    "pydantic-ai-slim[google,groq]>=1.77.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.4.1",
]

[project.optional-dependencies]
# Cross-encoder reranking for Document.get_relevant_sections(use_laya=True),
# backed by domdistill's LayaReranker. Pulls in torch + laya (~1.7 GB weights).
laya = [
    "laya>=0.3.0",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests",
]

[tool.setuptools.packages.find]
include = ["scout*"]

[tool.setuptools.package-data]
scout = ["scripts/**/*.js", "scripts/*.js"]

[tool.uv.sources]
# TEMPORARY: pinned to the laya-reranker branch so LayaReranker resolves before
# https://github.com/ArnabChatterjee20k/domdistill/pull/5 merges. Revert to the
# default-branch source (drop `branch`) once that PR is in.
domdistill = { git = "https://github.com/ArnabChatterjee20k/domdistill.git", branch = "feat/laya-reranker" }
