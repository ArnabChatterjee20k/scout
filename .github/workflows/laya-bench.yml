name: laya-rerank-benchmark

# Compares Document.get_relevant_sections with the default bi-encoder vs. the
# laya cross-encoder reranker. Runs on a CPU GitHub runner so the ~1.7 GB laya
# download never touches a local machine. Results go to the job summary, an
# artifact, and a sticky PR comment.

on:
  pull_request:
    paths:
      - "scout/core.py"
      - "benchmarks/**"
      - "pyproject.toml"
      - ".github/workflows/laya-bench.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Cache Hugging Face checkpoints
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-laya-${{ runner.os }}

      - name: Install scout with laya extra (CPU torch)
        # setup-uv (with python-version) already created .venv for us.
        run: |
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[laya]"

      - name: Run get_relevant_sections benchmark (embedding vs laya)
        run: |
          uv run python benchmarks/bench_relevant_sections.py \
            --engines embedding,laya \
            --markdown-out bench_relevant.md | tee bench_relevant.json

      - name: Publish to job summary
        if: always()
        run: |
          {
            echo "## get_relevant_sections: laya reranker vs. bi-encoder (CPU runner)"
            echo
            cat bench_relevant.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laya-rerank-benchmark
          path: |
            bench_relevant.md
            bench_relevant.json

      - name: Post / update PR comment
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## laya reranker benchmark (get_relevant_sections)\n\n';
            try {
              body += fs.readFileSync('bench_relevant.md', 'utf8');
            } catch (err) {
              body += '_Benchmark did not produce output; see the job logs._';
            }
            body += `\n\n_CPU-only GitHub runner — relative comparison, not GPU latency. ([run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}))_`;
            const marker = '<!-- laya-rerank-benchmark -->';
            body += `\n${marker}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
